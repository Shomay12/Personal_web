name: Deploy Personal Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Latest Commit
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          git log -1 --oneline

      - name: Verify Website Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

          echo "Website files found:"
          ls -la index.html projects.html style.css projects.css script.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website
        run: |
          mkdir -p _site
          cp index.html style.css script.js _site/

          if [ -f projects.html ]; then
            cp projects.html _site/
          fi

          if [ -f projects.css ]; then
            cp projects.css _site/
          fi

          if [ -d assets ]; then
            cp -R assets _site/
          fi

          if [ -f robots.txt ]; then
            cp robots.txt _site/
          fi

          if [ -f sitemap.xml ]; then
            cp sitemap.xml _site/
          fi

          if [ -f Shomay_Singh_Parihar_Resume.pdf ]; then
            cp Shomay_Singh_Parihar_Resume.pdf _site/
          fi

          echo "Published files:"
          find _site -maxdepth 3 -type f

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
