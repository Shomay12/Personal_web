name: Deploy Personal Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Latest Commit
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          git log -1 --oneline

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website
        run: |
          set -e

          mkdir -p _site

          # Main website
          cp index.html _site/
          cp style.css _site/
          cp script.js _site/

          # Projects page
          cp projects.html _site/
          cp projects.css _site/

          # Journal page
          cp journal.html _site/
          cp journal.css _site/
          cp journal.js _site/

          # Assets
          if [ -d assets ]; then
            cp -R assets _site/
          fi

          # Resume
          if [ -f Shomay_Singh_Parihar_Resume.pdf ]; then
            cp Shomay_Singh_Parihar_Resume.pdf _site/
          fi

          # SEO files
          if [ -f robots.txt ]; then
            cp robots.txt _site/
          fi

          if [ -f sitemap.xml ]; then
            cp sitemap.xml _site/
          fi

          # Custom 404 page
          if [ -f 404.html ]; then
            cp 404.html _site/
          fi

          echo "Published files:"
          find _site -maxdepth 3 -type f | sort

          # Verify critical pages exist in the deployment artifact
          test -f _site/index.html
          test -f _site/projects.html
          test -f _site/journal.html

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
