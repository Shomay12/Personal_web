<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Decorative Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200"/>
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675"/>
  </g>
  <!-- Ambient Orbs -->
  <circle cx="250" cy="220" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="450" r="220" fill="#818cf8" opacity="0.14" filter="url(#glow)"/>

  <!-- Card Body -->
  <g transform="translate(100, 95)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">LIVE PLATFORM</text>

    <!-- Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">OpenUPSC Platform</text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.65)">Civil Services Exam Intelligence &amp; Structured Study Architecture</text>

    <!-- UI Mockup Wireframe -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="1000" height="280" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <!-- Sidebar wireframe -->
      <rect x="20" y="20" width="220" height="240" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)"/>
      <rect x="36" y="40" width="120" height="12" rx="6" fill="#38bdf8" opacity="0.8"/>
      <rect x="36" y="70" width="160" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
      <rect x="36" y="95" width="140" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
      <rect x="36" y="120" width="170" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
      <rect x="36" y="145" width="130" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
      <rect x="36" y="170" width="150" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>

      <!-- Main Content Grid -->
      <g transform="translate(260, 20)">
        <rect x="0" y="0" width="720" height="50" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#ffffff">General Studies · Prelims &amp; Mains Roadmap</text>

        <!-- 3 Feature Cards -->
        <rect x="0" y="70" width="226" height="170" rx="10" fill="rgba(56, 189, 248, 0.04)" stroke="rgba(56, 189, 248, 0.2)"/>
        <text x="20" y="105" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">01. Syllabus Matrix</text>
        <text x="20" y="130" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Topic-wise breakdown</text>
        <text x="20" y="150" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Cross-linked reference</text>

        <rect x="246" y="70" width="226" height="170" rx="10" fill="rgba(129, 140, 248, 0.04)" stroke="rgba(129, 140, 248, 0.2)"/>
        <text x="266" y="105" font-family="sans-serif" font-size="14" font-weight="700" fill="#818cf8">02. Resource Vault</text>
        <text x="266" y="130" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Curated study materials</text>
        <text x="266" y="150" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Previous years papers</text>

        <rect x="492" y="70" width="226" height="170" rx="10" fill="rgba(56, 189, 248, 0.04)" stroke="rgba(56, 189, 248, 0.2)"/>
        <text x="512" y="105" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">03. Edge Speed</text>
        <text x="512" y="130" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Next.js App Router</text>
        <text x="512" y="150" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Vercel Edge deployed</text>
      </g>
    </g>
  </g>
</svg>