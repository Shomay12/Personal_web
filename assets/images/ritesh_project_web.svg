        <rect x="0" y="0" width="390" height="266" rx="10" fill="rgba(10, 15, 26, 0.6)" stroke="rgba(255, 255, 255, 0.06)"/>

        <!-- Header -->
        <text x="24" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Architecture Benchmarks</text>
        <line x1="24" y1="46" x2="366" y2="46" stroke="rgba(255,255,255,0.06)"/>

        <!-- Lighthouse metric row -->
        <g transform="translate(24, 62)">
          <rect x="0" y="0" width="70" height="48" rx="8" fill="rgba(39, 201, 63, 0.12)" stroke="rgba(39, 201, 63, 0.4)"/>
          <text x="35" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#27c93f">100</text>
          <text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#27c93f">PERF</text>

          <rect x="85" y="0" width="70" height="48" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)"/>
          <text x="120" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#38bdf8">100</text>
          <text x="120" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#38bdf8">SEO</text>

          <rect x="170" y="0" width="70" height="48" rx="8" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.4)"/>
          <text x="205" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#818cf8">100</text>
          <text x="205" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#818cf8">BEST PRAC</text>

          <rect x="255" y="0" width="85" height="48" rx="8" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.4)"/>
          <text x="297" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#c084fc">0.00</text>
          <text x="297" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#c084fc">CLS SHIFT</text>
        </g>

        <!-- Tech tags -->
        <g transform="translate(24, 130)">
          <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">ENGINEERING STACK</text>
          <rect x="0" y="12" width="105" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text x="12" y="28" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.85)">Semantic HTML5</text>

          <rect x="115" y="12" width="105" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text x="127" y="28" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.85)">CSS Variables</text>

          <rect x="230" y="12" width="112" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text x="242" y="28" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.85)">Vanilla JS (ES6)</text>

          <rect x="0" y="44" width="160" height="24" rx="12" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)"/>
          <text x="12" y="60" font-family="JetBrains Mono, monospace" font-size="11" fill="#38bdf8">IntersectionObserver API</text>

          <rect x="170" y="44" width="172" height="24" rx="12" fill="rgba(129,140,248,0.1)" stroke="rgba(129,140,248,0.3)"/>
          <text x="182" y="60" font-family="JetBrains Mono, monospace" font-size="11" fill="#818cf8">Fluid Viewport Typography</text>
        </g>

        <!-- GitHub link badge -->
        <g transform="translate(24, 218)">
          <rect x="0" y="0" width="342" height="34" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)"/>
          <text x="16" y="22" font-family="JetBrains Mono, monospace" font-size="11" fill="#38bdf8">github.com/Shomay12/Ritesh-project-web</text>
          <text x="320" y="22" font-family="sans-serif" font-size="13" fill="#38bdf8">↗</text>
        </g>
