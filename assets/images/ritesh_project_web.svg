<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ritesh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ritesh-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="ritesh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep background -->
  <rect width="1200" height="675" fill="url(#ritesh-bg)"/>

  <!-- Atmospheric Grid Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200"/>
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="220" r="220" fill="#38bdf8" opacity="0.12" filter="url(#ritesh-glow)"/>
  <circle cx="960" cy="420" r="240" fill="#818cf8" opacity="0.14" filter="url(#ritesh-glow)"/>
  <circle cx="600" cy="560" r="180" fill="#c084fc" opacity="0.08" filter="url(#ritesh-glow)"/>

  <g transform="translate(80, 70)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PORTFOLIO &amp; BUSINESS WEB</text>

    <!-- Main Title & Description -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Ritesh — Portfolio &amp; Business Web</text>
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.7)">High-Performance Commercial Showcase · Modular Responsive Layout · Zero-Dependency Motion</text>

    <!-- Interactive Mockup Canvas Container -->
    <g transform="translate(0, 150)">
      <!-- Main Browser Frame Window -->
      <rect x="0" y="0" width="1040" height="360" rx="14" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
      
      <!-- Window Title Bar -->
      <path d="M0,14 Q0,0 14,0 L1026,0 Q1040,0 1040,14 L1040,42 L0,42 Z" fill="rgba(255, 255, 255, 0.04)"/>
      <line x1="0" y1="42" x2="1040" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#ff5f56"/>
      <circle cx="42" cy="21" r="5" fill="#ffbd2e"/>
      <circle cx="60" cy="21" r="5" fill="#27c93f"/>
      <rect x="360" y="11" width="320" height="20" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="440" y="25" font-family="JetBrains Mono, monospace, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">ritesh-project-web / portfolio</text>

