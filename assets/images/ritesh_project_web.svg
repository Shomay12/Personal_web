      <!-- Left: Mockup Hero & Services Preview -->
      <g transform="translate(30, 64)">
        <rect x="0" y="0" width="560" height="266" rx="10" fill="rgba(10, 15, 26, 0.6)" stroke="rgba(255, 255, 255, 0.06)"/>
        
        <!-- Mock Nav -->
        <rect x="24" y="20" width="90" height="10" rx="4" fill="#38bdf8" opacity="0.9"/>
        <rect x="360" y="22" width="40" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
        <rect x="415" y="22" width="40" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
        <rect x="470" y="18" width="65" height="16" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.5)"/>
        <line x1="24" y1="44" x2="536" y2="44" stroke="rgba(255,255,255,0.06)"/>

        <!-- Mock Hero text -->
        <text x="24" y="78" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CLIENT SHOWCASE</text>
        <text x="24" y="106" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">Creative Direction &amp; Modern Craft</text>
        <text x="24" y="130" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">Engineering a bespoke identity for Ritesh with high-speed web foundations.</text>

        <!-- 3 Feature Mock Cards -->
        <g transform="translate(24, 152)">
          <!-- Card 1 -->
          <rect x="0" y="0" width="160" height="92" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(56, 189, 248, 0.25)"/>
          <circle cx="20" cy="22" r="8" fill="rgba(56, 189, 248, 0.2)"/>
          <text x="20" y="26" text-anchor="middle" font-size="10" fill="#38bdf8">⚡</text>
          <text x="36" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Zero Bloat</text>
          <text x="14" y="48" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">0 external JS libs</text>
          <text x="14" y="64" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Sub-50ms paint</text>
          <text x="14" y="80" font-family="sans-serif" font-size="10" fill="#38bdf8">100 Performance</text>

          <!-- Card 2 -->
          <rect x="175" y="0" width="160" height="92" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(129, 140, 248, 0.25)"/>
          <circle cx="195" cy="22" r="8" fill="rgba(129, 140, 248, 0.2)"/>
          <text x="195" y="26" text-anchor="middle" font-size="10" fill="#818cf8">📐</text>
          <text x="211" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fluid CSS Grid</text>
          <text x="189" y="48" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Mobile to 4K Ultrawide</text>
          <text x="189" y="64" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">CSS Custom Tokens</text>
          <text x="189" y="80" font-family="sans-serif" font-size="10" fill="#818cf8">No Layout Shift (CLS 0)</text>

          <!-- Card 3 -->
          <rect x="350" y="0" width="160" height="92" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(192, 132, 252, 0.25)"/>
          <circle cx="370" cy="22" r="8" fill="rgba(192, 132, 252, 0.2)"/>
          <text x="370" y="26" text-anchor="middle" font-size="10" fill="#c084fc">✨</text>
          <text x="386" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Native Motion</text>
          <text x="364" y="48" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">IntersectionObserver</text>
          <text x="364" y="64" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Hardware Acceleration</text>
          <text x="364" y="80" font-family="sans-serif" font-size="10" fill="#c084fc">60 FPS Scroll Reveal</text>
        </g>
      </g>

